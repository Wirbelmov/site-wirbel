# Atualiza as views do portfólio a cada hora e publica o site no GitHub Pages.
# Precisa de: um segredo YT_API_KEY (chave grátis da YouTube Data API v3) e
# Settings → Pages → Source = "GitHub Actions".
name: Atualizar views e publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 * * * *"   # todo minuto 7 de cada hora (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:       # botão "Run workflow" para rodar na hora

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Buscar views no YouTube
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python3 tools/update_views.py

      - name: Escrever os trabalhos e a ficha profissional no HTML, nos 3 idiomas (SEO)
        run: python3 tools/prerender.py

      - name: Salvar no repositório se mudou
        run: |
          if [ -n "$(git status --porcelain -- projects.json index.html en es sitemap.xml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add projects.json index.html en es sitemap.xml
            git commit -m "Atualiza views"
            git push
          else
            echo "Views iguais às anteriores; nada a salvar."
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
