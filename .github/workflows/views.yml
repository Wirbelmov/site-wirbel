# Atualiza as views do portfólio a cada 5 minutos e publica o site no GitHub Pages.
# Precisa de: um segredo YT_API_KEY (chave grátis da YouTube Data API v3) e
# Settings → Pages → Source = "GitHub Actions".
#
# Dois passos separados:
#   1. "atualizar" busca as views, reescreve o HTML e salva no repositório se algo mudou;
#   2. "publicar" só roda quando há o que publicar: quando o passo 1 salvou mudanças,
#      quando alguém enviou arquivos (push) ou quando o botão "Run workflow" foi usado.
# Assim a execução agendada que não encontrou mudança termina em segundos, sem republicar o site.
name: Atualizar views e publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"   # a cada 5 minutos, o menor intervalo do GitHub (pode atrasar em horários cheios)
  workflow_dispatch:         # botão "Run workflow" para rodar na hora

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Buscar views no YouTube
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python3 tools/update_views.py

      - name: Escrever os trabalhos e a ficha profissional no HTML, nos 3 idiomas (SEO)
        run: python3 tools/prerender.py

      - name: Salvar no repositório se mudou
        id: save
        run: |
          if [ -n "$(git status --porcelain -- projects.json index.html en es sitemap.xml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add projects.json index.html en es sitemap.xml
            git commit -m "Atualiza views"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Views iguais às anteriores; nada a salvar."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  publicar:
    needs: atualizar
    if: needs.atualizar.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the commit the first job may have just pushed
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
